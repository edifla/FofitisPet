services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fofitis
      POSTGRES_PASSWORD: fofitis
      POSTGRES_DB: fofitispet
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fofitis -d fofitispet"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
