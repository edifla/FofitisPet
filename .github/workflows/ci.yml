name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fofitis
          POSTGRES_PASSWORD: fofitis
          POSTGRES_DB: fofitispet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fofitis -d fofitispet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://fofitis:fofitis@localhost:5432/fofitispet?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Validar schema do Prisma
        run: npx prisma validate

      - name: Aplicar migrations
        run: npx prisma migrate deploy

      - name: Conferir se o schema bate com as migrations
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Lint
        run: npm run lint

      - name: Formatação
        if: hashFiles('node_modules/prettier/package.json') != ''
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Checagem de tipos (depois do build, que gera next-env.d.ts)
        run: npm run typecheck

      - name: Testes
        if: hashFiles('vitest.config.*') != ''
        run: npm test
